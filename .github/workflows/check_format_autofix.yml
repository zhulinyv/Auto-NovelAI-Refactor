name: Check Format & Autofix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # 规则与 pyproject.toml 的 [tool.ruff] 保持一致: line-length=120, select=[E,W,F], ignore=[E501]
      - name: Ruff lint
        run: ruff check . --output-format=github --line-length 120 --select E,W,F --ignore E501

      - name: Ruff format check
        run: ruff format --check . --line-length 120

  autofix:
    name: Auto-fix code style
    runs-on: ubuntu-latest
    # 仅在推送到默认分支时自动修复并提交, 避免改写他人 PR 分支
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # 规则与 pyproject.toml 的 [tool.ruff] 保持一致: line-length=120, select=[E,W,F], ignore=[E501]
      - name: Apply ruff fixes
        run: |
          ruff check . --fix --line-length 120 --select E,W,F --ignore E501
          ruff format . --line-length 120

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: ':art: 自动修复代码格式'
          add: |
            .
